services:
  db:
    image: pgvector/pgvector:pg17
    container_name: bottega_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bottega}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bottega2026}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - bottega_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bottega}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bottega_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BOTTEGA_ENV: ${BOTTEGA_ENV:-dev}
      BOTTEGA_LOG_FORMAT: ${BOTTEGA_LOG_FORMAT:-text}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-bottega}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-bottega2026}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen2.5-coder:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "127.0.0.1:8501:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  bottega_pgdata: